ServerName localhost
ServerTokens Prod
ServerSignature Off

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
<IfDefine LAURA_PREVIEW>
    Header always set X-Robots-Tag "noindex, nofollow"
</IfDefine>

<Directory /var/www/html>
    Options -Indexes -MultiViews
    AllowOverride None
    DirectoryIndex index.php index.html
    RewriteEngine On
    RewriteRule ^(?:$|robots\.txt$|sitemap\.xml$|content/site\.json$|[^/]+\.html$|(?:servizi|iniziative)/[^/]+\.html$) _render.php [END]
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

<Directory /var/www/html/lib>
    Require all denied
</Directory>

Alias /assets/uploads/ /data/uploads/
<Directory /data/uploads>
    Options -Indexes -ExecCGI -MultiViews
    AllowOverride None
    Require all denied
    <FilesMatch "^[a-z0-9-]+\.(?:jpg|png|webp)$">
        SetHandler none
        Require all granted
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</Directory>

<Location /healthz>
    SetHandler none
</Location>
Alias /healthz /var/www/html/content/health.txt
